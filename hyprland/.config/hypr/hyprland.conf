# ──────────────── General ────────────────
exec = hyprpaper
exec-once = setxkbmap -layout us -variant de_se_fi -option caps:escape
exec-once = waybar &
exec-once = nm-applet --indicator


monitor = eDP-1, 2240x1400, 0x0, 1

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,JetBrainsMonoNerdFont

# ──────────────── Input ────────────────
input {
  kb_layout = us
  kb_variant = de_se_fi
  follow_mouse = 1
  touchpad {
    natural_scroll = yes
  }
}

# ──────────────── Appearance ────────────────
general {
  gaps_in = 3
  gaps_out = 5
  border_size = 3
  col.active_border = rgb(C6A0F6)
  col.inactive_border = rgb(1e2030)
}

animations {
    enabled = no
}

# ──────────────── Window Rules ────────────────
# Example: workspace = 1, class:^(firefox)$

# ──────────────── Binds ────────────────
$mod = SUPER
$term = kitty
$browser = chromium

# App Launchers
bind = $mod, RETURN, exec, $term
bind = $mod, w, exec, $browser
bind = $mod, m, exec, $term -e ranger
bind = $mod, d, exec, rofi -show run

# Audio
bind = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +2%
bind = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -2%
bind = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness
bind = ,XF86MonBrightnessUp, exec, brightnessctl set 2%+
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 2%-

# Screenshots
bind = $mod SHIFT, s, exec, grimshot copy area, 10

# Window Management
bind = $mod, q, killactive,
bind = $mod SHIFT, space, togglefloating,
bind = $mod, f, fullscreen,

# Movement (focus)
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# Move Windows
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# Resize (approximate to i3 behavior)
bind = $mod SHIFT, y, resizeactive, 10 0
bind = $mod SHIFT, u, resizeactive, 0 -10
bind = $mod SHIFT, i, resizeactive, 0 10
bind = $mod SHIFT, o, resizeactive, -10 0

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Power/System
bind = $mod SHIFT, x, exec, ~/.config/hypr/system_menu.sh

# Nightlight
bind = $mod, n, exec, redshift -P -O 2300
bind = $mod SHIFT, n, exec, redshift -x

# Bluetooth connect
bind = $mod SHIFT, b, exec, bluetoothctl connect 14:3F:A6:E8:83:FE

